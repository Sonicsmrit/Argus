name: "OCCRP"
url: "https://www.occrp.org"
region: "Global, Eastern Europe/Central Asia"
category: "investigative-nonprofit"
rss_feed: "https://www.occrp.org/en/feed"
sample_article_urls:
  - "https://www.occrp.org"
  - "https://www.occrp.org/en/news/us-charges-eight-more-iranians-in-global-hacking-case"
  - "https://www.occrp.org/en/news/indonesia-seizes-record-26-tons-of-meth-in-major-bust-10-arrested"
