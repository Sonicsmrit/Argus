structured_data_available: true
structured_data_type: "OpenGraph"
selectors:
  headline: { primary: "h1", fallback: "h1, meta[property="og:title"]" }
  byline: { primary: "a[rel="author"]", fallback: "a[href*="/author/"], [class*="byline"], meta[name="author"]" }
  date: { primary: "time[datetime]", fallback: "meta[property="article:published_time"], [class*="publish"], time" }
  body: { primary: "article", fallback: "article, [role="article"], main, [class*="content"]" }
  section_tag: { primary: "", fallback: "meta[property="article:section"], [class*="tag"], [class*="category"], nav[aria-label*="bread"]" }
structural_fingerprint: "header(1) > nav(1) > article(46) > section(3) > aside(1) > footer(1)"
antibot_observed: "none"
robots_txt_notes: "Disallows: /. AI/scraping clauses found (8 lines). Blocked bots: quillbot.com."
access_status: "ok"
last_checked: "2026-08-19"
